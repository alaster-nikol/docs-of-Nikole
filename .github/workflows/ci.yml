name: ci
on:
  push:
    branches:
      - main
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # важно для gh-deploy
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install mkdocs-material mkdocs-open-in-new-tab  # ← добавлен плагин
      
      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force